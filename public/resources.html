<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources | Diverse Consulting</title>
  <style>
:root{
  --deep:#020818;
  --navy:#00163f;
  --navy2:#00266f;
  --blue:#0066ff;
  --blue2:#0048d8;
  --sky:#40a5ff;
  --soft:#f6f9ff;
  --line:#dce7f6;
  --text:#071735;
  --muted:#5d6c86;
  --gold:#ffb400;
  --white:#fff;
  --shadow:0 20px 50px rgba(0,28,85,.14);
  --soft-shadow:0 10px 28px rgba(0,28,85,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,Arial,Helvetica,sans-serif;
  color:var(--text);
  background:#fff;
  line-height:1.55;
}
img{max-width:100%;display:block}
a{text-decoration:none;color:inherit}
.container{width:min(1240px,92%);margin:auto}

/* Top information bar */
.topbar{
  background:linear-gradient(90deg,#000b24,#001d54);
  color:#fff;
  font-size:12px;
}
.topbar-inner{
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}
.topbar p{margin:0;font-weight:700}
.topbar p span{color:var(--gold)}
.topbar-links{display:flex;align-items:center;gap:20px}
.topbar-links a{color:#fff;font-weight:700;opacity:.95}

/* Header */
.header{
  position:sticky;
  top:0;
  z-index:100;
  height:104px;
  background:rgba(255,255,255,.98);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);
  box-shadow:0 5px 18px rgba(0,28,85,.04);
}
.nav{
  height:104px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:24px;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  flex-shrink:0;
  min-width:260px;
}
.brand-logo{
  width:76px;
  height:76px;
  object-fit:contain;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:4px;
  box-shadow:0 8px 20px rgba(0,28,85,.08);
}
.brand-text{
  display:flex;
  flex-direction:column;
  line-height:1.05;
}
.brand-text strong{
  color:var(--navy);
  font-size:18px;
  letter-spacing:-.04em;
  font-weight:900;
}
.brand-text small{
  color:var(--blue);
  font-size:11px;
  font-weight:900;
  margin-top:5px;
  text-transform:uppercase;
  letter-spacing:.05em;
}
.menu{
  display:flex;
  align-items:center;
  gap:24px;
  font-size:14px;
  font-weight:800;
}
.menu a{
  position:relative;
  color:#071739;
  white-space:nowrap;
}
.menu a:hover,.menu a.active{color:var(--blue)}
.menu a.active:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-17px;
  height:2px;
  background:var(--blue);
}
.actions{
  display:flex;
  align-items:center;
  gap:16px;
}
.search{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid var(--line);
  display:grid;
  place-items:center;
  color:var(--navy);
  background:#fff;
  font-size:24px;
}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  background:var(--blue);
  color:#fff;
  padding:14px 22px;
  border-radius:6px;
  font-weight:900;
  border:1px solid #005bea;
  box-shadow:none;
  cursor:pointer;
  transition:.2s ease;
  line-height:1;
  -webkit-font-smoothing:antialiased;
}
.btn:hover{
  background:#004fd1;
  transform:translateY(-1px);
  box-shadow:0 8px 18px rgba(0,102,255,.16);
}
.btn.small{padding:11px 16px;font-size:13px}
.menu-toggle{
  display:none;
  width:46px;
  height:46px;
  border:0;
  border-radius:9px;
  background:#eef5ff;
}
.menu-toggle span{
  width:22px;
  height:2px;
  background:var(--navy);
  display:block;
  margin:5px auto;
}

/* Hero and inner hero */
.hero,.pagehero{
  position:relative;
  overflow:hidden;
  color:#fff;
  background:
    radial-gradient(circle at 77% 52%,rgba(0,102,255,.62),transparent 24%),
    radial-gradient(circle at 16% 70%,rgba(0,102,255,.20),transparent 24%),
    linear-gradient(110deg,#020818,#00163f 56%,#00319a);
}
.hero:before,.pagehero:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.033) 0 1px,transparent 1px 82px),
    linear-gradient(135deg,transparent,rgba(0,102,255,.10));
}
.hero:after,.pagehero:after{
  content:"";
  position:absolute;
  left:-5%;
  right:-5%;
  bottom:-56px;
  height:120px;
  background:#fff;
  border-radius:0 0 50% 50%/0 0 100% 100%;
  transform:rotate(-2deg);
  z-index:1;
}
.hero-inner{
  position:relative;
  z-index:2;
  min-height:520px;
  display:grid;
  grid-template-columns:1fr 1.05fr;
  gap:42px;
  align-items:center;
  padding:46px 0 100px;
}
.kicker{
  margin:0 0 12px;
  color:#1f8bff;
  text-transform:uppercase;
  font-weight:950;
  font-size:14px;
  letter-spacing:.04em;
}
.hero h1{
  font-size:clamp(2.8rem,5vw,5.1rem);
  line-height:1.03;
  letter-spacing:-.06em;
  margin:0 0 18px;
  text-shadow:0 14px 34px rgba(0,0,0,.22);
}
.hero h1 span,.blue{color:var(--blue)}
.hero p{
  max-width:640px;
  color:#eef5ff;
  font-size:15.5px;
  line-height:1.6;
}
.checks{
  display:flex;
  flex-wrap:wrap;
  gap:18px 26px;
  margin:24px 0;
}
.checks span{
  font-size:13px;
  font-weight:750;
}
.checks span:before{
  content:"âœ“";
  display:inline-grid;
  place-items:center;
  width:20px;
  height:20px;
  border:2px solid var(--blue);
  color:var(--blue);
  border-radius:50%;
  margin-right:8px;
  font-size:11px;
  background:rgba(0,102,255,.08);
}
.hero-actions{
  display:flex;
  gap:26px;
  align-items:center;
  flex-wrap:wrap;
}
.watch{
  display:flex;
  align-items:center;
  gap:13px;
  font-weight:850;
  color:#fff;
}
.watch i{
  font-style:normal;
  width:48px;
  height:48px;
  border:2px solid rgba(255,255,255,.32);
  border-radius:50%;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.08);
}
.hero-logo{
  justify-self:end;
  width:min(560px,100%);
  background:#fff;
  border-radius:26px;
  padding:18px;
  box-shadow:0 35px 95px rgba(0,102,255,.42),inset 0 0 0 1px rgba(0,102,255,.08);
}
.hero-logo img{
  width:100%;
  height:auto;
  border-radius:18px;
}

/* Quick cards */
.quick-wrap{
  position:relative;
  z-index:5;
  margin-top:-70px;
}
.quick{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.quick article{
  display:grid;
  grid-template-columns:62px 1fr;
  gap:18px;
  padding:30px;
  border-right:1px solid var(--line);
}
.quick article:last-child{border-right:0}
.ico{
  width:60px;
  height:60px;
  border-radius:50%;
  background:#eef5ff;
  color:var(--blue);
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:950;
  box-shadow:inset 0 0 0 1px rgba(0,102,255,.08);
}
.quick h3{font-size:15px;margin:0 0 6px}
.quick p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 12px}
.quick a,.card a,.blogcard a{color:var(--blue);font-weight:900;font-size:13px}

/* Sections */
.section{padding:78px 0}
.section.tight{padding-top:34px}
.soft{background:var(--soft)}
.title{
  text-align:center;
  max-width:820px;
  margin:0 auto 38px;
}
.title.left{text-align:left;margin-left:0}
.title p{
  margin:0 0 8px;
  color:var(--blue);
  text-transform:uppercase;
  font-weight:950;
  font-size:12px;
}
.title h2{
  font-size:clamp(2rem,3vw,3rem);
  line-height:1.14;
  margin:0 0 10px;
  letter-spacing:-.035em;
}
.title small{color:var(--muted)}
.catrow{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  border-bottom:1px solid #e5edf7;
}
.catrow a{
  text-align:center;
  padding:18px 10px;
  border-right:1px solid var(--line);
  font-size:13px;
  font-weight:850;
  transition:.2s;
}
.catrow a:hover{color:var(--blue);transform:translateY(-3px)}
.catrow a:last-child{border-right:0}
.catrow b{
  display:block;
  color:var(--blue);
  font-size:29px;
  margin-bottom:9px;
}

/* Testimonials and stats */
.testgrid{
  display:grid;
  grid-template-columns:1.1fr 1fr 1fr 1fr;
  gap:24px;
}
.testintro{border-right:1px solid var(--line);padding-right:18px}
.testintro h3{font-size:22px;line-height:1.15;margin:0 0 10px}
.testintro p,.testcard p{font-size:13px;color:var(--muted);line-height:1.55}
.testcard{border-right:1px solid var(--line);padding:0 18px}
.testcard:last-child{border-right:0}
.avatar{
  width:66px;
  height:66px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--navy));
  display:grid;
  place-items:center;
  color:#fff;
  font-weight:950;
  margin-bottom:12px;
  box-shadow:0 10px 24px rgba(0,102,255,.25);
}
.testcard strong{display:block;font-size:12px}
.testcard span{display:block;color:var(--muted);font-size:11px}
.stars{color:var(--gold);margin-top:7px}
.stats{
  background:linear-gradient(90deg,#00153e,#00309a);
  color:#fff;
  padding:30px 0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}
.statsgrid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:18px;
}
.stat{
  display:grid;
  grid-template-columns:50px 1fr;
  grid-template-rows:auto auto;
  column-gap:12px;
  align-items:center;
  border-right:1px solid rgba(255,255,255,.25);
}
.stat:last-child{border-right:0}
.stat i{
  grid-row:1/3;
  width:46px;
  height:46px;
  border:2px solid rgba(255,255,255,.75);
  border-radius:50%;
  display:grid;
  place-items:center;
  font-style:normal;
}
.stat strong{font-size:23px}
.stat span{font-size:12px;color:#dce9ff}

/* Inner pages */
.pagehero{padding:82px 0 98px}
.pagehero .container{
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:1fr 330px;
  gap:30px;
  align-items:center;
}
.pagehero h1{
  font-size:clamp(2.4rem,4vw,4.4rem);
  line-height:1.08;
  letter-spacing:-.045em;
  margin:0 0 12px;
}
.pagehero p{color:#dce9ff;max-width:720px}
.pagehero img{
  background:#fff;
  border-radius:20px;
  padding:12px;
  box-shadow:0 30px 75px rgba(0,102,255,.3);
}
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:48px;
  align-items:center;
}
.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:16px;
  box-shadow:var(--shadow);
}
.copy h2{
  font-size:clamp(2rem,3vw,3rem);
  line-height:1.15;
  margin:0 0 14px;
  letter-spacing:-.035em;
}
.copy p{color:var(--muted);line-height:1.6}
.checklist{padding:0;margin:20px 0 0;list-style:none}
.checklist li{margin:11px 0;color:#34445f;font-size:14px}
.checklist li:before{
  content:"âœ“";
  display:inline-grid;
  place-items:center;
  width:18px;
  height:18px;
  background:var(--blue);
  color:#fff;
  border-radius:50%;
  font-size:10px;
  margin-right:9px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}
.cards.four{grid-template-columns:repeat(4,1fr)}
.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:28px;
  box-shadow:var(--soft-shadow);
  transition:.2s;
}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.card b{color:var(--blue);font-size:34px}
.card h3{margin:12px 0 8px}
.card p{color:var(--muted);font-size:13px;line-height:1.55}

/* Pricing, reviews, blog, contact */
.pricing{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:28px;
}
.pricecard{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:34px;
  box-shadow:var(--soft-shadow);
}
.pricecard.featured{
  background:linear-gradient(180deg,var(--blue),#0037aa);
  color:#fff;
  transform:translateY(-14px);
}
.price{font-size:42px;font-weight:950;letter-spacing:-.03em}
.price small{font-size:14px}
.pricecard li{margin:11px 0;color:#52627a}
.pricecard.featured li,.pricecard.featured p{color:#dbe9ff}
.filters{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:28px;
}
.filters button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:9px 16px;
  font-weight:850;
  color:#5d6c86;
  cursor:pointer;
}
.filters .active{background:var(--blue);color:#fff}
.bloglayout{
  display:grid;
  grid-template-columns:1fr 280px;
  gap:30px;
}
.bloggrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}
.blogcard{
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
  background:#fff;
  box-shadow:var(--soft-shadow);
}
.blogimg{
  height:150px;
  background:radial-gradient(circle at 75% 25%,rgba(0,102,255,.55),transparent 22%),linear-gradient(135deg,#00133a,#0066ff);
}
.blogbody{padding:18px}
.blogbody small{color:#5d6c86}
.blogbody h3{font-size:17px;line-height:1.25}
.sidebar{
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:24px;
  margin-bottom:20px;
}
.sidebar a,.sidebar p{display:block;color:#40506b;font-size:13px;margin:11px 0}
.contact{
  display:grid;
  grid-template-columns:.9fr 1.4fr;
  gap:44px;
}
.info div{
  display:grid;
  grid-template-columns:46px 1fr;
  gap:0 16px;
  margin-bottom:22px;
}
.info b{
  grid-row:1/3;
  width:46px;
  height:46px;
  border:1px solid var(--line);
  border-radius:50%;
  display:grid;
  place-items:center;
  color:var(--blue);
}
.info h3{margin:0}
.info p{margin:3px 0 0;color:#5d6c86;font-size:13px}
.formbox{
  border:1px solid var(--line);
  border-radius:12px;
  padding:28px;
  box-shadow:var(--soft-shadow);
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
input,textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:6px;
  padding:14px 15px;
  margin-bottom:14px;
  font:inherit;
}
textarea{resize:vertical}

/* Footer */
.prefooter{
  background:#001b4d;
  color:#fff;
  padding:24px 0;
}
.preinner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:22px;
}
.preinner h3{margin:0 0 4px}
.preinner p{margin:0;color:#cfe0ff;font-size:13px}
.footer{
  background:linear-gradient(180deg,#001438,#000a24);
  color:#fff;
  padding:42px 0 18px;
}
.footgrid{
  display:grid;
  grid-template-columns:1.7fr 1fr 1fr 1fr 1.5fr;
  gap:30px;
}
.footgrid img{
  max-width:220px;
  background:#fff;
  border-radius:8px;
  padding:6px;
  margin-bottom:16px;
}
.footer p{color:#cfe0ff;font-size:13px}
.footer a{display:block;color:#dce9ff;font-size:13px;margin:9px 0}
.footform{display:flex}
.footform input{
  margin:0;
  border:0;
  min-width:0;
  border-radius:5px 0 0 5px;
}
.footform button{
  border:0;
  background:var(--blue);
  color:#fff;
  font-weight:800;
  padding:0 12px;
  border-radius:0 5px 5px 0;
}
.bottom{
  border-top:1px solid rgba(255,255,255,.14);
  margin-top:30px;
  padding-top:16px;
  display:flex;
  justify-content:space-between;
  gap:20px;
}
.bottom div{display:flex;gap:30px}

/* Responsive */
@media(max-width:1080px){
  .menu,.actions{display:none}
  .menu-toggle{display:block}
  .nav{justify-content:space-between}
  .menu.open{
    display:flex;
    position:absolute;
    top:104px;
    left:4%;
    right:4%;
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:22px;
    flex-direction:column;
    align-items:flex-start;
    gap:18px;
  }
  .hero-inner,.pagehero .container,.grid2,.bloglayout,.contact{
    grid-template-columns:1fr;
  }
  .hero-logo,.pagehero img{justify-self:center}
  .quick,.catrow,.testgrid,.statsgrid,.cards,.cards.four,.pricing,.bloggrid,.footgrid{
    grid-template-columns:repeat(2,1fr);
  }
}
@media(max-width:720px){
  .topbar-links{display:none}
  .topbar-inner{justify-content:center;text-align:center}
  .header,.nav{height:96px}
  .brand{min-width:auto}
  .brand-logo{width:64px;height:64px}
  .brand-text strong{font-size:15px}
  .brand-text small{font-size:9px}
  .hero h1{font-size:40px}
  .quick,.catrow,.testgrid,.statsgrid,.cards,.cards.four,.pricing,.bloggrid,.footgrid{
    grid-template-columns:1fr;
  }
  .quick article,.testcard,.stat{
    border-right:0;
    border-bottom:1px solid var(--line);
  }
  .hero-actions,.preinner,.bottom{
    flex-direction:column;
    align-items:flex-start;
  }
  .row{grid-template-columns:1fr}
}

.page-confirm-badge{
  position:relative;
  z-index:4;
  margin-top:-42px;
}
.page-confirm-badge .container{
  display:flex;
  justify-content:flex-start;
}
.page-confirm-badge span{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#ffffff;
  color:#0066ff;
  border:1px solid #dce7f6;
  border-radius:999px;
  padding:10px 16px;
  font-size:13px;
  font-weight:900;
  box-shadow:0 12px 28px rgba(0,28,85,.10);
}
.page-confirm-badge span:before{
  content:"âœ“";
  width:18px;
  height:18px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#0066ff;
  color:#fff;
  font-size:11px;
}


/* ==============================
   Experience Enhancements Layer
   Keeps the original structure and visual identity
   ============================== */

:root{
  --glass:rgba(255,255,255,.82);
  --focus:0 0 0 4px rgba(0,102,255,.18);
}

body{
  overflow-x:hidden;
}

a:focus-visible,
button:focus-visible,
input:focus-visible,
textarea:focus-visible{
  outline:none;
  box-shadow:var(--focus);
}

.progress-bar{
  position:fixed;
  top:0;
  left:0;
  height:4px;
  width:0%;
  background:linear-gradient(90deg,#0066ff,#40a5ff);
  z-index:9999;
  box-shadow:0 0 18px rgba(0,102,255,.55);
}

.skip-link{
  position:absolute;
  left:-999px;
  top:10px;
  background:#0066ff;
  color:#fff;
  padding:10px 14px;
  border-radius:8px;
  z-index:10000;
  font-weight:900;
}
.skip-link:focus{
  left:12px;
}

.header{
  transition:height .25s ease, box-shadow .25s ease, background .25s ease;
}
.header.is-scrolled{
  box-shadow:0 12px 30px rgba(0,28,85,.12);
}
.header.is-scrolled .brand-logo{
  transform:scale(.92);
}
.brand-logo{
  transition:transform .25s ease;
}

.hero:after,
.pagehero:after{
  pointer-events:none;
}

.reveal-up{
  opacity:0;
  transform:translateY(22px);
  transition:opacity .65s ease, transform .65s ease;
}
.reveal-up.visible{
  opacity:1;
  transform:translateY(0);
}

.hover-lift{
  transition:transform .2s ease, box-shadow .2s ease;
}
.hover-lift:hover{
  transform:translateY(-5px);
  box-shadow:var(--shadow);
}

.smart-panel{
  background:linear-gradient(135deg,#ffffff,#f6f9ff);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--soft-shadow);
  padding:28px;
}

  display:grid;
  grid-template-columns:1fr 1.1fr;
  gap:28px;
  align-items:center;
}

  font-size:clamp(2rem,3vw,3rem);
  line-height:1.12;
  letter-spacing:-.04em;
  margin:0 0 12px;
}
.tool-finder p{
  color:var(--muted);
}
.quiz-box{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:24px;
  box-shadow:var(--soft-shadow);
}

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:18px 0;
}
.quiz-options button{
  border:1px solid var(--line);
  background:#f8fbff;
  color:var(--text);
  border-radius:12px;
  padding:13px 14px;
  font-weight:850;
  cursor:pointer;
  text-align:left;
  transition:.2s ease;
}
.quiz-options button:hover,
.quiz-options button.active{
  border-color:var(--blue);
  background:#eef5ff;
  color:var(--blue);
}
.quiz-result{
  border-left:4px solid var(--blue);
  background:#f6f9ff;
  border-radius:12px;
  padding:16px;
  color:#34445f;
  display:none;
}
.quiz-result.show{
  display:block;
}

.insight-strip{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-top:28px;
}
.insight-card{
  border:1px solid var(--line);
  border-radius:16px;
  padding:20px;
  background:#fff;
  box-shadow:var(--soft-shadow);
}
.insight-card strong{
  display:block;
  font-size:28px;
  color:var(--blue);
  letter-spacing:-.04em;
}
.insight-card span{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.comparison-enhanced{
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--soft-shadow);
  background:#fff;
}

  display:grid;
  grid-template-columns:1.2fr .9fr .8fr .9fr;

  border-bottom:1px solid var(--line);
}
.comparison-row:last-child{
  border-bottom:0;
}

  background:#eef5ff;
  color:var(--navy);
  font-weight:950;
}
.comparison-row a{
  color:var(--blue);
  font-weight:900;
}

.faq-list{
  max-width:900px;
  margin:0 auto;
  display:grid;
  gap:12px;
}
.faq-item{
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  box-shadow:var(--soft-shadow);
  overflow:hidden;
}
.faq-question{
  width:100%;
  border:0;
  background:#fff;
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px;
  text-align:left;
  font-weight:900;
  cursor:pointer;
}
.faq-question span{
  color:var(--blue);
  font-size:20px;
}
.faq-answer{
  max-height:0;
  overflow:hidden;
  transition:max-height .25s ease;
  padding:0 20px;
  color:var(--muted);
}
.faq-item.open .faq-answer{
  max-height:160px;
  padding-bottom:18px;
}

.trust-badges{

  border-radius:999px;

  font-weight:850;
  box-shadow:0 8px 20px rgba(0,28,85,.06);
}

.floating-help{

  right:22px;
  bottom:22px;
  z-index:999;
  display:grid;
  gap:10px;
}
.floating-help a,
.floating-help button{

  background:#0066ff;
  color:#fff;
  font-size:20px;

  transition:.2s ease;
}
.floating-help a:hover,
.floating-help button:hover{

}
.back-to-top{
  opacity:0;
  pointer-events:none;
}
.back-to-top.show{
  opacity:1;
  pointer-events:auto;
}

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%) translateY(20px);
  background:#00163f;
  color:#fff;
  border-radius:999px;
  padding:12px 18px;
  box-shadow:0 14px 30px rgba(0,28,85,.22);

  z-index:1000;

  font-size:13px;
  font-weight:850;

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
